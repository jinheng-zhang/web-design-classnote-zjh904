<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        console.log(Math.floor(1.9));//向下取整
        console.log(Math.round(1.9));//四舍五入
        console.log(Math.random());//随机数取到0-1之间
        //0-100的整数
        console.log(Math.floor(Math.random()*101));//floor取到整数

        //date对象
        var date = new Date();//创建一个date对象
        console.log(date.getFullYear());//获取年份
        console.log(date.getMonth() + 1);//获取月份， 0-11
        console.log(date.getDate());     //获取日期
        console.log(date.getDay());//获取星期几， 0-6  0是星期日
        console.log(date.getHours() + ":" + date.getMinutes() + ":" + date.getSeconds())
        console.log(date.getTime());//获取时间戳 1970-1-1 00:00:00到当前时间间隔的毫秒数

        //数组
        var arr = [1, 2, 3, 4, 5, 6, 'seven', 'eight', 'nine', 'ten'];
        var arr1 = new Array(1, 2, 3, 4, 5, 'seven', 'eight')
        var arr2 = new Array(5);// new Array(单个数字)表示数组长度，不是元素
        console.log(arr);
        console.log(arr1);
        console.log(arr2);// [ <5 empty items> ]  输出 5 个空位，长度为 5
        console.log(arr.length);//数组的长度（注意：length是属性，老师划掉的 var arr.Length 是错误写法）
    </script>
</body>
</html>
