<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上图下文与图上文字</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        img {
            display: block;
            width: 100%;
            border: none;
        }

        .container {
            width: 1200px;
            margin: 0 auto;
        }

        .container h2 {
            margin-top: 24px;
        }

        /* 并集选择器 */
        .list1,
        .list2 {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            list-style: none;
            /* li之间的间隔 */
            gap: 10px;
            margin-top: 20px;
        }

        /* 绝对定位的父元素设置相对定位 */
        .list2 li {
            position: relative;
        }

        .list1 li,
        .list2 li {
            /* flex参数不缩放，
            每项占一行中的三分之一，基础间距是10px */
            flex: 0 0 calc(33.33% - 10px);
        }

        .list1 li a,
        .list2 li a {
            text-decoration: none;
            color: black;
            display: block;
        }

        .list1 li a p {
            /* 文字水平居中 */
            text-align: center;
            /* 当文字的height和line-height一致时
            文字垂直居中 */
            height: 36px;
            line-height: 36px;
            font-size: 16px;
            font-weight: bold;
            /* 文字间距 */
            letter-spacing: 2px;
        }

        .list2 p {
            position: absolute;
            bottom: 0;
            left: 0;
            background-color: rgba(99, 100, 255, 0.8);
            color: white;
            text-align: center;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            /* 垂直居中 */
            line-height: 36px;
            height: 36px;
        }

        .list1 img {
            transition: all .6s ease-in-out;
        }

        .list1 li:hover img {
            /* 变化：放大1.5倍 */
            transform: scale(1.5);
        }

        .list2 li:hover p {
            height: 96px;
        }

        /* nth-child(odd) 奇数的孩子*/
        .list2 li:nth-child(odd):hover p {
            height: 100%;
            font-weight: normal;
            color: yellow;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>上图下文</h2>
        <!-- ul.list1>li>a>img+p回车 -->
        <ul class="list1">
            <li><a href="./stack.html"><img src="./image/1.jpg" alt="pic1">
                    <p>图片1文字描述</p></a></li>
            <li><a href="./stack.html"><img src="./image/2.jpg" alt="pic2">
                    <p>图片2文字描述</p></a></li>
            <li><a href="./stack.html"><img src="./image/3.jpg" alt="pic3">
                    <p>图片3文字描述</p></a></li>
            <li><a href="./stack.html"><img src="./image/4.jpg" alt="pic4">
                    <p>图片4文字描述</p></a></li>
            <li><a href="./stack.html"><img src="./image/5.jpg" alt="pic5">
                    <p>图片5文字描述</p></a></li>
            <li><a href="./stack.html"><img src="./image/6.jpg" alt="pic6">
                    <p>图片6文字描述</p></a></li>
        </ul>

        <h2>图上文字</h2>
        <ul class="list2">
            <li><a href="./stack.html"><img src="./image/1.jpg" alt="pic1">
                    <p>图片1文字描述</p></a></li>
            <li><a href="./stack.html"><img src="./image/2.jpg" alt="pic2">
                    <p>图片2文字描述</p></a></li>
            <li><a href="./stack.html"><img src="./image/3.jpg" alt="pic3">
                    <p>图片3文字描述</p></a></li>
            <li><a href="./stack.html"><img src="./image/4.jpg" alt="pic4">
                    <p>图片4文字描述</p></a></li>
            <li><a href="./stack.html"><img src="./image/5.jpg" alt="pic5">
                    <p>图片5文字描述</p></a></li>
            <li><a href="./stack.html"><img src="./image/6.jpg" alt="pic6">
                    <p>图片6文字描述</p></a></li>
        </ul>
    </div>
</body>

</html>
