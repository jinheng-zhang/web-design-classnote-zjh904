        <nav data-page-node-id="ferNki8xRslvyPA32D0YwE">

    <hr data-page-node-id="wZCDECH32ZiUG4bppiAEpJ">

    <article data-page-node-id="5XkkMtGYYnlBcjId1aPFGg">
        <h2 data-page-node-id="6kRRi4LexwTm7i4yUBUxBp">欢迎给我留言</h2>
        <p data-page-node-id="kuRT3EK30atwsFozQPcAzV">
            这是本作品的表单子页面，使用了课上讲过的基础表单元素：
            文本框、密码框、邮箱框、文件上传、单选框、复选框、
            多行文本域、下拉列表以及提交 / 重置 / 普通按钮。
        </p>

        <form action="http://baidu.com" name="fm" method="post" data-page-node-id="aRm2p5egBsDjkBngHhkral">
            <p data-page-node-id="AzAfsp8mELITPM0oO2buMM">
                <label for="uname" data-page-node-id="8wY9nG9iuAh93C8ANslogA">用户名：</label>
                <input type="text" id="uname" name="uname" placeholder="请输入用户名" required data-page-node-id="5hVlzcHJHcMlyrADeqrvjd">
            </p>
            <p data-page-node-id="6sBiRxtEg8KJiYHFHhRNOi">
                <label for="pwd" data-page-node-id="XGRnH2taJTFJFZUBtcEVsC">密码：</label>
                <input type="password" id="pwd" name="pwd" data-page-node-id="PJ8I0hH3FDu4DDXHdRqLoc">
            </p>
            <p data-page-node-id="5pCpgiUfe4etcXWiSrJEB9">
                <label for="email" data-page-node-id="oLSEhfdaRBTOuwzcwN5bgO">邮箱：</label>
                <input type="email" id="email" name="email" data-page-node-id="RNDuOyVssRwmxsdwAa1oGM">
            </p>
            <p data-page-node-id="0FxAhvkUmCXEUWWj9znoVt">
                请上传文件：
                <input type="file" id="file" name="file" multiple data-page-node-id="a6x5jLwo9CO4NM5wXFpxTC">
            </p>
            <p data-page-node-id="NcadLpXf0wIu3Y5DYsvlxy">
                性别：
                <input type="radio" name="gender" value="f" checked data-page-node-id="QcWaEPdeqe7WL4tTXwzpWW">女
                <input type="radio" name="gender" value="m" data-page-node-id="YVeGHJFiy4aUCAUPOVQKuJ">男
            </p>
            <p data-page-node-id="njfQVxtbH1KvN8VzTTsh4c">
                爱好：
                <input type="checkbox" name="hobby" value="c" data-page-node-id="ExMYXxKc3Nb5LboK9UhIpf"> coding
                <input type="checkbox" name="hobby" value="s" data-page-node-id="YkNTpOaoXufSv5OApDdnOm"> playing
                <input type="checkbox" name="hobby" value="r" data-page-node-id="LzcmKuas29iHT5uhEi9GIG"> reading
            </p>
            <p data-page-node-id="WWfGjcycTdW34rfeBAABKx">
                <label for="intro" data-page-node-id="UxauhdlOSgdOBKqHuaSVsY">自我介绍：</label>
                <textarea name="intro" id="intro" cols="30" rows="8" placeholder="写点什么介绍自己吧……"></textarea>
            </p>
            <p data-page-node-id="bqeCWw4D4ABEIjggOTTkGy">
                <label for="city" data-page-node-id="KyRP7cRBE3aElLlxPmpatt">籍贯：</label>
                <select name="city" id="city" data-page-node-id="wwMdtCLZnwBXMvrFipc4UA">
                    <option value="beijing" data-page-node-id="aKhOYGD3yGg4YGacEl1dgW">北京</option>
                    <option value="shanghai" data-page-node-id="Z0LF2RfuMkYpSiDxa15b5D">上海</option>
                    <option value="guangzhou" data-page-node-id="XiwFBKBOLicqlV6WttKDVw">广州</option>
                </select>
            </p>
            <p class="btn-group" data-page-node-id="Z8GsLUAQbaIWBgn6UFrBRw">
                <input type="submit" value="提交" data-page-node-id="u93aGmd8yeWcBxlh93D2iH">
                <input type="reset" value="重置" data-page-node-id="KHYrn0JxzRXHVRtHKPTO5r">
                <input type="button" value="取消" data-page-node-id="kGlBvFbBcCOSiTwHc01oz5">
            </p>
        </form>
