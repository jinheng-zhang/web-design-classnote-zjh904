<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留言表单 - 张敬恒的自我介绍</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>留言表单</h1>
        <nav>
            <a href="introduce.html">← 返回自我介绍主页</a>
            <a href="index.html">课堂实践目录</a>
        </nav>
    </header>

    <hr>

    <article>
        <h2>欢迎给我留言</h2>
        <p>
            这是本作品的表单子页面，使用了课上讲过的基础表单元素：
            文本框、密码框、邮箱框、文件上传、单选框、复选框、
            多行文本域、下拉列表以及提交 / 重置 / 普通按钮。
        </p>

        <form action="http://baidu.com" name="fm" method="post">
            <p>
                <label for="uname">用户名：</label>
                <input type="text" id="uname" name="uname" placeholder="请输入用户名" required>
            </p>
            <p>
                <label for="pwd">密码：</label>
                <input type="password" id="pwd" name="pwd">
            </p>
            <p>
                <label for="email">邮箱：</label>
                <input type="email" id="email" name="email">
            </p>
            <p>
                请上传文件：
                <input type="file" id="file" name="file" multiple>
            </p>
            <p>
                性别：
                <input type="radio" name="gender" value="f" checked>女
                <input type="radio" name="gender" value="m">男
            </p>
            <p>
                爱好：
                <input type="checkbox" name="hobby" value="c"> coding
                <input type="checkbox" name="hobby" value="s"> playing
                <input type="checkbox" name="hobby" value="r"> reading
            </p>
            <p>
                <label for="intro">自我介绍：</label>
                <textarea name="intro" id="intro" cols="30" rows="8" placeholder="写点什么介绍自己吧……"></textarea>
            </p>
            <p>
                <label for="city">籍贯：</label>
                <select name="city" id="city">
                    <option value="beijing">北京</option>
                    <option value="shanghai">上海</option>
                    <option value="guangzhou">广州</option>
                </select>
            </p>
            <p class="btn-group">
                <input type="submit" value="提交">
                <input type="reset" value="重置">
                <input type="button" value="取消">
            </p>
        </form>
    </article>

    <footer>
        <p>&copy; 2026 张敬恒（24001010904）&nbsp;|&nbsp;
            <a href="introduce.html">回到自我介绍</a>
            &nbsp;|&nbsp; <a href="index.html">课堂实践目录</a></p>
    </footer>

</body>
</html>
