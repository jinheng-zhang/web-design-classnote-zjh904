    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        img {
            display: block;
            width: 100%;
            border: none;
        }

        .container {
            width: 1200px;
            margin: 0 auto;
        }

        /* 并集选择器 */
        .list1,
        .list2 {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            list-style: none;
            /* li之间的间隔 */
            gap: 10px;
            margin-top: 20px;
        }

        /* 绝对定位的父元素设置相对定位 */
        .list2 li {
            position: relative;
        }

        .list1 li,
        .list2 li {
            /* flex参数不缩放，
            每项占一行中的三分之一，基础间距是10px */
            flex: 0 0 calc(33.33% - 10px);
        }

        .list1 li a,
        .list2 li a {
            text-decoration: none;
            color: black;
            display: block;
        }

        .list1 li a p {
            /* 文字水平居中 */
            text-align: center;
            /* 当文字的height和line-height一致时
            文字垂直居中 */
            height: 36px;
            line-height: 36px;
            font-size: 16px;
            font-weight: bold;
            /* 文字间距 */
            letter-spacing: 2px;
        }

        .list2 p {
            position: absolute;
            bottom: 0;
            left: 0;
            background-color: rgba(99, 100, 255, 0.8);
            color: white;
            text-align: center;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            /* 垂直居中 */
            line-height: 36px;
            height: 36px;
        }
    </style>
</head>
