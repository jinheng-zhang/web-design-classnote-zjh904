<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上图下文与图上文字</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            color: #333;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
            padding: 0 20px;
            background-color: #2c3e50;
            color: #fff;
        }

        header .logo {
            font-size: 20px;
            font-weight: bold;
        }

        nav {
            height: 40px;
            line-height: 40px;
            text-align: center;
            background-color: #34495e;
            color: #fff;
        }

        .wrap {
            width: 1200px;
            margin: 0 auto;
        }

        .content-row {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        main {
            flex: 3;
            min-height: 400px;
            background-color: #ecf0f1;
            text-align: center;
            line-height: 400px;
            border-radius: 4px;
        }

        aside {
            flex: 1;
            min-height: 400px;
            background-color: #dfe6e9;
            text-align: center;
            line-height: 400px;
            border-radius: 4px;
        }

        footer {
            margin-top: 20px;
            line-height: 50px;
            text-align: center;
            background-color: #2c3e50;
            color: #fff;
        }

        .fixed-ad {
            position: fixed;
            right: 20px;
            bottom: 20px;
            padding: 10px 16px;
            background-color: rgba(230, 126, 34, 0.95);
            color: #fff;
            border-radius: 6px;
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">logo</div>
        <div class="login">login</div>
    </header>
    <nav>导航</nav>
    <div class="wrap">
        <div class="content-row">
            <main>主要内容</main>
            <aside>侧栏</aside>
        </div>
    </div>
    <footer>904 张敬恒</footer>
    <div class="fixed-ad">固定定位广告</div>
</body>

</html>
